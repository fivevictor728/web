<!DOCTYPE html>

    <title>電機三乙 33080233 劉子維 九九乘法表</title>
<style>
table, th, td {
  border:1px solid rgb(33, 33, 33);
  border-collapse: collapse
}
h1 {
  width: 555px;
  margin: auto;
  background-color: #FFF4A3;
}
</style>

<script>
    document.write("<h1>電機三乙 33080233 劉子維 九九乘法表</h1>")    
    document.write("<table align='center'>");
    for (let i = 1; i <= 9; i++) {
        document.write("<tr>");
        for (let j = 1; j <= i ; j++) {
            document.write("<td>");
            document.write(i + " * " + j + " = " + (i * j) + "&nbsp;&nbsp;&nbsp;");
            document.write("</td>");
        }
        document.write("</tr>");
    }
    document.write("</table>");
</script>
