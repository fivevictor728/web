<!DOCTYPE html>
<html>
<body style="text-align: center;background-color: antiquewhite;font-family: '標楷體', 'DFKai-SB', serif;font-size: 2cap;">
<title>電機三乙 劉子維 燈泡互動小程式</title>
<h1 style="font-size: 4cap;">電機三乙 劉子維 燈泡互動小程式</h1>
<p>這是一個兩地控制一燈的小程式</p>
<hr>
<div>
    <button id="btn1" style="width: 10cap;height: 5cap;border-radius: 30px;">2F</button>  
    <div >
    <br>
      <!-- 預設顯示第一張圖片 -->
      <img id="myImage" src="pic/pic_bulboff.gif" alt="圖片" width="130">
    </div>
    <!-- 1. 將兩個按鈕給予不同的 id (btn1 與 btn2) -->
    <br>
    <button id="btn2" style="width: 10cap;height: 5cap;border-radius: 30px;">1F</button>
  </div>

<script>
 const imgElement = document.getElementById('myImage');
    const btn1 = document.getElementById('btn1');
    const btn2 = document.getElementById('btn2');

    // 定義圖片路徑
    const img1 = "pic/pic_bulboff.gif";
    const img2 = "pic/pic_bulbon.gif";

    // 開關狀態 (true 代表第一張圖，false 代表第二張圖)
    let isFirstImage = true;

    // 3. 定義切換圖片的函式 (toggleImage)
    function toggleImage() {
      if (isFirstImage) {
        imgElement.src = img2;
      } else {
        imgElement.src = img1;
      }
      // 每次點擊後將狀態反轉
      isFirstImage = !isFirstImage;
    }

    // 4. 為兩個按鈕都綁定相同的切換動作
    btn1.addEventListener('click', toggleImage);
    btn2.addEventListener('click', toggleImage);
</script>
<hr>
<p> </p>
<div style="background-color: azure;width: 50cap;margin: auto;border-radius: 30px;padding: 1cap;">
<p>兩地控制一燈的必要性在於兼顧「便利、安全、節能」三大目的，</p>
<p> 使使用者能在不同位置自由控制同一照明設備，提升空間的使用品質。</p>             
<p>使用者不必走回原來的位置關燈或開燈，</p>
<p>例如上樓時在樓下開燈，到樓上後可直接關燈。</p>
</div>
</body>
</html>
