<h1 style="font-size: 5cap;font-family: '標楷體', 'DFKai-SB', serif;text-align: center;">禮記大同篇</h1>


<pre style="font-size: 3cap;font-family: '標楷體', 'DFKai-SB', serif;background-color: rgb(246, 246, 111);">
    大道之行也，天下為公。選賢與能，講信修睦。故人不獨親其親，不獨子其子；
    使老有所終，壯有所用，幼有所長，矜、寡、孤、獨、廢疾者，皆有所養；男有分，女有歸。
    貨，惡其棄於地也，不必藏於己；力，惡其不出於身也，不必為己。
    是故謀閉而不興，盜竊亂賊而不作，故外戶而不閉，是謂「大同」。
</pre>
