<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>大樂透自動選號與兌獎系統（Lotto）</title>
    <style>
        .lotto1{
            background-color: brown;
            color: rgb(201, 213, 209);
            font-size: 28px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 10cap;
            height: 3cap;
            line-height: 3cap;
            font-family: '標楷體', 'DFKai-SB', serif;
        }
        .lotto1:hover{
            background-color: rgb(202, 77, 40);
            transform: scale(1.05);
        }
        span{
            background-color: rgb(74, 238, 113);
            border-radius: 50%;
            display: inline-block;
            width: 50px;
            height: 50px;
            line-height: 50px;
            border: 2px solid;
        }
    </style>
</head>

<body style="font-size: 3cap;text-align: center;font-family: '標楷體', 'DFKai-SB', serif;background-color: bisque;">
    
    <h1>🎰電機三乙劉子維 大樂透自動選號與兌獎系統</h1>
    <p><b>教學重點：</b>利用 id 屬性與 document.getElementById() 修改網頁內容</p>
    
    <!-- 宣告全域變數，用來記錄玩家選號與開獎號碼 -->
    <script>
        let userNumbers = [];
        let winningNumbers = [];
    </script>
    <hr> <!-- 水平分隔線 --> <!--[cite: 1] -->

<div style="background-color: azure;padding: 10px;border-radius: 30px;margin: auto;width: 36cap;height: 13cap;">
    <!-- 第一區塊：玩家選號區 -->
    <h3>1. 我的彩券號碼</h3>
    <!-- 設定 id="my-numbers" 供 JS 更新文字 -->
    <p id="my-numbers" style="min-height: 58px";>請點擊下方按鈕進行選號</p>
   
    <!-- 按鈕點擊時，直接執行內嵌的 JavaScript 程式碼（不使用 custom function） -->
    <button class="lotto1"; onclick="
        userNumbers = [];
        while (userNumbers.length < 6) {
            let randNum = Math.floor(Math.random() * 49) + 1;
            if (!userNumbers.includes(randNum)) {
                userNumbers.push(randNum);
            }
        }
        userNumbers.sort((a, b) => a - b);
        let o1 = userNumbers.map(n => '<span>' + n + '</span>').join(' ');
        document.getElementById('my-numbers').innerHTML = '我的號碼：' +  o1;
    ">🎲 自動選號</button>
</div> 
    <hr> <!--[cite: 1] -->
<div style="background-color: azure;padding: 10px;border-radius: 30px;margin: auto;width: 36cap;height: 13cap;">

    <!-- 第二區塊：電腦開獎區 -->
    <h3>2. 本期開獎號碼</h3>
    <!-- 設定 id="draw-numbers" 供 JS 更新文字 -->
    <p id="draw-numbers" style="min-height: 58px;">等待開獎中...</p>
    
    <button class="lotto1"; onclick="
        winningNumbers = [];
        while (winningNumbers.length < 6) {
            let randNum = Math.floor(Math.random() * 49) + 1;
            if (!winningNumbers.includes(randNum)) {
                winningNumbers.push(randNum);
            }
        }
        winningNumbers.sort((a, b) => a - b);
        let o2 = winningNumbers.map(n => '<span>' + n + '</span>').join(' ');
        document.getElementById('draw-numbers').innerHTML = '開獎號碼：' + o2;
    ">🎉 開始開獎</button>
</div>
    <hr> <!--[cite: 1] -->
<div style="background-color: azure;padding: 10px;border-radius: 30px;margin: auto;width: 36cap;height: 12cap;">

    <!-- 第三區塊：對獎結果區 -->
    <h3>3. 兌獎結果</h3>
    <button class="lotto1"; onclick="
        if (userNumbers.length === 0 || winningNumbers.length === 0) {
            alert('請先點擊「自動選號」與「開始開獎」！');
        } else {
            let matchCount = 0;
            let matchedList = [];
            
            // 利用迴圈比對對中幾個號碼
            for (let i = 0; i < userNumbers.length; i++) {
                if (winningNumbers.includes(userNumbers[i])) {
                    matchCount++;
                    matchedList.push(userNumbers[i]);
                }
            }

            let resultText = '本次共兌中了' + matchCount + '個號碼！';
            if (matchCount > 0) {
                resultText += '(兌中號碼：' + matchedList.join('、') + ')';
                alert('恭喜中獎!');
            }
            else{
                alert('遺憾沒中獎...')
            }

            // 更新到指定 id 的元素中
            document.getElementById('result-text').innerText = resultText;
        }
    ">🔍 進行對獎</button>
    <!-- 顯示對獎結果的標籤 (id="result-text") -->
    <p id="result-text" style="font-weight: bold;"></p>
</div>
<p> </p>
    <hr> <!--[cite: 1] -->
<p> </p>
    <button class="lotto1"; onclick="window.location.reload(); ">🎲 重新開始</button>
<p> </p>
</body>
</html>
